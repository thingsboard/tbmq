database.ts_max_intervals=700
stats.print-interval-ms=5000
# Each integration test class starts a fresh Kafka, so the msg-all consumer group has no committed offsets.
# With the default 'latest' reset, a PUBLISH produced before the group's first assignment (or during a startup rebalance) is skipped.
queue.kafka.msg-all.additional-consumer-config=auto.offset.reset:earliest
# Swagger/springdoc is off in tests; OpenApiSpecTest turns it back on to generate api/openapi.json.
springdoc.api-docs.enabled=false
