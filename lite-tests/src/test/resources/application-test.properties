database.ts_max_intervals=700
stats.print-interval-ms=5000
# Swagger/springdoc is off in tests.
springdoc.api-docs.enabled=false
# The release check would call api.github.com from every test context.
app.version-check.enabled=false
# No free-space watermark: a test context must not refuse writes because the build host's disk is nearly full.
# DiskFullLiteTest sets its own watermark.
store.disk.min-free-percent=0
store.disk.min-free-bytes=0
