<div class="mat-padding flex flex-col" [formGroup]="entityForm">
  <fieldset class="fields-group">
    <mat-form-field class="mat-block">
      <mat-label translate>authorization-policy.name</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>
    <div class="tb-hint" translate>authorization-policy.rules-hint</div>
    <div class="mt-2 flex flex-1 flex-col" formGroupName="authorizationRules">
      <tb-topic-rules-chip-list
        formControlName="pubAuthRulePatterns"
        [label]="'mqtt-client-credentials.authorization-rule-patterns-pub' | translate"
        [placeholder]="'mqtt-client-credentials.add-topic-rule' | translate"
        [warningTooltip]="'mqtt-client-credentials.warning-pub' | translate">
      </tb-topic-rules-chip-list>
      <tb-topic-rules-chip-list
        formControlName="subAuthRulePatterns"
        [label]="'mqtt-client-credentials.authorization-rule-patterns-sub' | translate"
        [placeholder]="'mqtt-client-credentials.add-topic-rule' | translate"
        [warningTooltip]="'mqtt-client-credentials.warning-sub' | translate">
      </tb-topic-rules-chip-list>
    </div>
  </fieldset>
</div>
