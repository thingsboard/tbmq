@let map = vm();
<svg class="tb-cluster-svg" [attr.viewBox]="'0 0 ' + map.width + ' ' + map.height" role="group"
     [attr.aria-label]="'monitoring.cluster.map-aria-label' | translate">

  <text class="tb-column-caption" [attr.x]="columnX.clients" y="22" text-anchor="middle">{{ 'monitoring.cluster.clients' | translate }}</text>
  <text class="tb-column-caption" [attr.x]="columnX.brokers" y="22" text-anchor="middle">{{ 'monitoring.cluster.brokers' | translate }}</text>
  <text class="tb-column-caption" [attr.x]="columnX.kafka" y="22" text-anchor="middle">{{ 'monitoring.cluster.kafka' | translate }}</text>
  <text class="tb-column-caption" [attr.x]="columnX.executors" y="22" text-anchor="middle">{{ 'monitoring.cluster.integrations' | translate }}</text>

  <!-- Edges are tracked by id and updated attribute-by-attribute: re-creating a path restarts every particle riding it. -->
  @for (edge of map.edges; track edge.id) {
    <path class="tb-edge" [attr.id]="edge.id" [attr.d]="edge.path"
          [attr.stroke-width]="edge.strokeWidth" [attr.stroke-opacity]="edge.opacity"/>
    @if (edge.rate !== null) {
      <path class="tb-edge-hit" [attr.d]="edge.path">
        <title>{{ 'monitoring.cluster.edge-tooltip' | translate: {rate: compactNumber(edge.rate)} }}</title>
      </path>
    }
    @if (animate()) {
      @for (slot of edge.particleSlots; track slot) {
        <circle class="tb-particle" r="2.5">
          <animateMotion [attr.dur]="edge.durSec + 's'" repeatCount="indefinite"
                         [attr.begin]="particleBegin(slot, edge.particleSlots.length, edge.durSec)">
            <mpath [attr.href]="'#' + edge.id"/>
          </animateMotion>
        </circle>
      }
    }
  }

  <g class="tb-clients">
    @for (pill of clientPills(map); track pill.key) {
      <g>
        <title>{{ pill.label | translate }}: {{ pill.count ?? '—' }}</title>
        <rect [class]="pill.count ? 'tb-clients-pill' : 'tb-clients-pill tb-clients-pill-side'"
              [attr.x]="map.clients.x - 26" [attr.y]="map.clients.y + pill.offset - 9" width="52" height="18" rx="9"/>
        <text class="tb-pill-count" [attr.x]="map.clients.x" [attr.y]="map.clients.y + pill.offset" text-anchor="middle" dominant-baseline="central">
          {{ pill.count === null ? '' : compactNumber(pill.count) }}
        </text>
      </g>
    }
    <text class="tb-node-id" [attr.x]="map.clients.x" [attr.y]="map.clients.y + 62" text-anchor="middle">
      {{ map.clients.hasSessionStats ? compactNumber(map.clients.totalSessions) : '—' }} {{ 'monitoring.cluster.sessions' | translate }}
    </text>
    <text class="tb-node-hint" [attr.x]="map.clients.x" [attr.y]="map.clients.y + 76" text-anchor="middle">{{ 'monitoring.cluster.clients-types' | translate }}</text>
  </g>

  @if (!map.brokers.length) {
    <text class="tb-node-hint" [attr.x]="columnX.brokers" [attr.y]="map.height / 2" text-anchor="middle" dominant-baseline="central">{{ 'monitoring.cluster.no-brokers' | translate }}</text>
  }
  @for (node of map.brokers; track node.id) {
    <ng-container *ngTemplateOutlet="nodeGlyph; context: {node: node}"/>
  }

  <g [class]="selectedId() === kafkaNodeId ? 'tb-kafka tb-node tb-node-selected' : 'tb-kafka tb-node'" role="button" tabindex="0"
     [attr.aria-pressed]="selectedId() === kafkaNodeId" [attr.aria-label]="'monitoring.cluster.kafka' | translate"
     (click)="onSelectKafka()" (keydown.enter)="onSelectKafka($event)" (keydown.space)="onSelectKafka($event)">
    <polygon class="tb-halo tb-kafka-halo" [attr.points]="kafkaHaloPoints(map)"/>
    <polygon class="tb-kafka-hex" [attr.points]="map.kafka.points"/>
    <text class="tb-node-count" [attr.x]="map.kafka.x" [attr.y]="map.kafka.y - 2" text-anchor="middle">{{ 'monitoring.cluster.kafka' | translate }}</text>
    <text class="tb-node-hint" [attr.x]="map.kafka.x" [attr.y]="map.kafka.y + 13" text-anchor="middle">
      {{ (map.kafka.brokerCount === 1 ? 'monitoring.cluster.kafka-broker' : 'monitoring.cluster.kafka-brokers') | translate: {count: map.kafka.brokerCount ?? '—'} }}
    </text>
    <text class="tb-node-sub" [attr.x]="map.kafka.x" [attr.y]="map.kafka.y + 68" text-anchor="middle">
      {{ 'monitoring.cluster.consumer-lag' | translate }} {{ map.kafka.totalLag !== null ? compactNumber(map.kafka.totalLag) : '—' }}
    </text>
  </g>

  @if (!map.executors.length) {
    <text class="tb-node-hint" [attr.x]="columnX.executors" [attr.y]="map.height / 2" text-anchor="middle" dominant-baseline="central">{{ 'monitoring.cluster.no-executors' | translate }}</text>
  }
  @for (node of map.executors; track node.id) {
    <ng-container *ngTemplateOutlet="nodeGlyph; context: {node: node}"/>
  }
</svg>

<ng-template #nodeGlyph let-node="node">
  <svg:g [class]="node.id === selectedId() ? 'tb-node tb-node-selected' : 'tb-node'" role="button" tabindex="0"
         [attr.aria-pressed]="node.id === selectedId()"
         [attr.aria-label]="'monitoring.cluster.node-aria-label' | translate: {id: node.id, sessions: node.sessions?.totalCount ?? 0, cpu: node.cpu ?? 0}"
         (click)="onSelect(node)" (keydown.enter)="onSelect(node, $event)" (keydown.space)="onSelect(node, $event)">
    <svg:circle class="tb-halo" [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.ringR + 7"/>
    <svg:circle [class]="node.hasDrops ? 'tb-ring-track tb-ring-track-drops' : 'tb-ring-track'"
                [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.ringR"/>
    <svg:circle [class]="'tb-ring-arc tb-' + node.cpuLevel" [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.ringR"
                [attr.stroke-dasharray]="ringArcDash(node.ringR, node.cpu)" [attr.transform]="'rotate(-90 ' + node.x + ' ' + node.y + ')'"/>
    <svg:circle [class]="'tb-disc tb-status-' + (node.stale ? 'STALE' : node.status)" [attr.cx]="node.x" [attr.cy]="node.y" [attr.r]="node.discR"/>
    @if (node.countLabel) {
      <svg:text class="tb-node-count" [attr.x]="node.x" [attr.y]="node.y" text-anchor="middle" dominant-baseline="central">{{ node.countLabel }}</svg:text>
    }
    <svg:text class="tb-node-id" [attr.x]="node.x" [attr.y]="node.y + node.ringR + 18" text-anchor="middle">{{ node.id }}</svg:text>
    @if (node.stale) {
      <svg:text class="tb-node-sub tb-stale" [attr.x]="node.x" [attr.y]="node.y + node.ringR + 31" text-anchor="middle">
        {{ 'monitoring.cluster.stale' | translate }}
      </svg:text>
    } @else {
      <svg:text [class]="'tb-node-sub tb-' + node.cpuLevel" [attr.x]="node.x" [attr.y]="node.y + node.ringR + 31" text-anchor="middle">
        {{ node.cpu !== null ? node.cpu + '% CPU' : '—' }}
      </svg:text>
    }
  </svg:g>
</ng-template>
