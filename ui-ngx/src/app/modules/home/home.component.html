<mat-sidenav-container [class.tb-desktop]="sidenavDesktop()"
                       [class.tb-collapsed]="sidenavCollapsed()">
  <mat-sidenav #sidenav class="tb-site-sidenav mat-elevation-z2"
    [class.tb-collapsed]="menuCollapsed()"
    [disableClose]="sidenavOpened()"
    (click)="sidenavClicked()"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()">
    <header #navHeader class="tb-nav-header">
      <mat-toolbar color="primary" class="tb-nav-header-toolbar">
        <tb-logo class="tb-logo-title"></tb-logo>
        @if (sidenavDesktop()) {
          <button mat-icon-button class="tb-sidenav-toggle tb-mat-40" (click)="toggleSidenav()">
            <tb-icon matButtonIcon>{{ sidenavCollapsed() ? 'mdi:menu-close' : 'mdi:menu-open' }}</tb-icon>
          </button>
        }
      </mat-toolbar>
      <tb-goto-menu [collapsed]="menuCollapsed()"
                    (searchBtnClicked)="toggleSidenav()"
                    (linkClicked)="sidenavClicked()"></tb-goto-menu>
    </header>
    <mat-toolbar color="primary" class="tb-side-menu-toolbar flex flex-1 flex-col" role="navigation">
      <div #sidebarScroll class="w-full flex-1 overflow-y-auto overflow-x-hidden">
        <tb-side-menu #sideMenu [collapsed]="menuCollapsed()"></tb-side-menu>
      </div>
      <div #sidebarBottom class="tb-sidebar-bottom flex flex-col">
        <tb-user-menu [collapsed]="menuCollapsed()" (menuClicked)="sidenavClicked()"></tb-user-menu>
      </div>
    </mat-toolbar>
  </mat-sidenav>
  <mat-sidenav-content class="tb-site-content">
    <div class="flex flex-col" role="main" style="height: 100%;">
      <mat-toolbar color="primary" class="tb-primary-toolbar flex flex-row">
        <button mat-icon-button id="main" class="gt-sm:!hidden" (click)="sidenav.toggle()">
          <mat-icon class="material-icons">menu</mat-icon>
        </button>
        <tb-breadcrumb class="mat-toolbar-tools flex-1">
        </tb-breadcrumb>
        <tb-github-badge class="lt-md:!hidden"></tb-github-badge>
        @if (fullscreenEnabled) {
          <button mat-icon-button class="lt-md:!hidden" (click)="toggleFullscreen()">
            <mat-icon class="material-icons">{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
          </button>
        }
        <tb-getting-started-link></tb-getting-started-link>
      </mat-toolbar>
      @if (isLoading$ | async) {
        <mat-progress-bar color="warn" style="z-index: 10; margin-bottom: -4px; width: 100%;" mode="indeterminate"
          >
        </mat-progress-bar>
      }
      <div tb-toast class="tb-main-content flex flex-1 flex-col">
        <router-outlet (activate)="activeComponentChanged($event)"></router-outlet>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
