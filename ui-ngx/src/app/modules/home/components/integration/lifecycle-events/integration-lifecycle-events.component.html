<div class="flex flex-col gap-2">
  <p class="text-sm text-gray-500">{{ 'integration.lifecycle-events-hint' | translate }}</p>
  @for (eventType of eventTypes; track eventType) {
    <mat-checkbox
      [checked]="isChecked(eventType)"
      [disabled]="disabled"
      (change)="toggle(eventType, $event.checked)">
      {{ eventTypeTranslations[eventType] | translate }}
    </mat-checkbox>
  }
  @if (selected.size === 0) {
    <p class="text-xs text-gray-400 mt-1">{{ 'integration.lifecycle-events-no-selection' | translate }}</p>
  }
</div>
